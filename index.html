<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>تطبيق العميل الميداني - نظام إدارة الصيانة</title>
  <meta name="description" content="تطبيق العميل لطلب ومتابعة خدمات الصيانة الميدانية في الجلفة مع خريطة التتبع المباشر وضمانات الأجهزة." />
  
  <!-- Tailwind CSS Play CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Leaflet CSS & JS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- React & ReactDOM UMD -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

  <!-- Babel Standalone for JSX compilation in browser -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap');
    body {
      font-family: 'Cairo', sans-serif;
    }
    .hide-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .hide-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-900 antialiased overflow-hidden">
  <div id="root" class="h-screen w-screen flex flex-col"></div>

  <!-- Firebase Global Initialization Module -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, addDoc, setDoc, onSnapshot, query, where, doc, updateDoc, limit } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
    import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    const firebaseConfig = {
      projectId: "gen-lang-client-0374218032",
      appId: "1:508606077218:web:6f516c7c54cc55932f6d7b",
      apiKey: "AIzaSyB4Yp4S2tZ53i6-04uDMvGfFcB65XR3nzE",
      authDomain: "gen-lang-client-0374218032.firebaseapp.com",
      firestoreDatabaseId: "ai-studio-remixfsmschemare-67cc9cc7-cdfb-4f95-9e38-ba04412593eb",
      storageBucket: "gen-lang-client-0374218032.firebasestorage.app",
      messagingSenderId: "508606077218",
      measurementId: ""
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app, firebaseConfig.firestoreDatabaseId);
    const auth = getAuth(app);

    signInAnonymously(auth).catch(err => console.warn("Auth warning:", err));

    window.db = db;
    window.auth = auth;
    window.collection = collection;
    window.addDoc = addDoc;
    window.setDoc = setDoc;
    window.onSnapshot = onSnapshot;
    window.query = query;
    window.where = where;
    window.doc = doc;
    window.updateDoc = updateDoc;
    window.limit = limit;
  </script>

  <!-- React Application Script (Babel) -->
  <script type="text/babel" data-presets="react">
    const { useState, useEffect, useRef } = React;
    const db = window.db;
    const collection = window.collection;
    const addDoc = window.addDoc;
    const setDoc = window.setDoc;
    const onSnapshot = window.onSnapshot;
    const query = window.query;
    const where = window.where;
    const doc = window.doc;
    const updateDoc = window.updateDoc;
    const limit = window.limit;

    const myLocation = [34.6728, 3.2546]; // Djelfa

    const DEFAULT_SERVICES = [
      {
        id: 'srv_ac_maint',
        category: 'تكييف وتبريد',
        name: 'صيانة وتنظيف مكيف سبليت',
        basePrice: 2500,
        isActive: true,
        addOns: [{ id: 'ao_1', name: 'شحن غاز الفريون R410', price: 3500 }]
      },
      {
        id: 'srv_ac_install',
        category: 'تكييف وتبريد',
        name: 'تركيب مكيف هواء جديد',
        basePrice: 6000,
        isActive: true,
        addOns: [{ id: 'ao_2', name: 'أنابيب نحاس إضافية (متر)', price: 1800 }]
      },
      {
        id: 'srv_heating_boiler',
        category: 'تدفئة مركزية',
        name: 'فحص وصيانة غلاية التدفئة (Chaudière)',
        basePrice: 3000,
        isActive: true,
        addOns: [{ id: 'ao_3', name: 'تنظيف شبكة المشعات (Radiateurs)', price: 4000 }]
      },
      {
        id: 'srv_plumbing_leak',
        category: 'ترصيص وسباكة',
        name: 'كشف وإصلاح تسربات المياه',
        basePrice: 2000,
        isActive: true,
        addOns: [{ id: 'ao_4', name: 'تغيير محبس رئيسي أصلي', price: 1500 }]
      }
    ];

    const CUSTOMER_STORAGE_KEY = 'fsm_customer_session';

    function handleFirestoreError(err, context) {
      console.error(`[Firestore Error - ${context}]:`, err);
    }

    function App() {
      const [customerSession, setCustomerSession] = useState(() => {
        try {
          const saved = localStorage.getItem(CUSTOMER_STORAGE_KEY);
          if (saved) {
            const parsed = JSON.parse(saved);
            if (parsed?.name && parsed?.phone) {
              const cleanPhone = String(parsed.phone).replace(/\s+/g, '');
              return { name: parsed.name, phone: cleanPhone, customerId: `cust_${cleanPhone}` };
            }
          }
        } catch {}
        return null;
      });

      const [loginName, setLoginName] = useState('');
      const [loginPhone, setLoginPhone] = useState('');
      const [currentScreen, setCurrentScreen] = useState('home');
      const [bookingStep, setBookingStep] = useState(1);
      const [selectedServiceId, setSelectedServiceId] = useState(null);
      const [isDirectBooking, setIsDirectBooking] = useState(false);
      const [services, setServices] = useState(DEFAULT_SERVICES);
      const [myJobs, setMyJobs] = useState([]);

      const customerId = customerSession?.customerId || '';

      useEffect(() => {
        if (!db) return;
        const unsubServices = onSnapshot(collection(db, 'services'), async (snapshot) => {
          if (snapshot.empty) {
            setServices(DEFAULT_SERVICES);
            for (const s of DEFAULT_SERVICES) {
              if (s.id) {
                try {
                  const { id, ...rest } = s;
                  await setDoc(doc(db, 'services', id), rest);
                } catch {}
              }
            }
            return;
          }
          const data = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));
          const active = data.filter(s => s.isActive);
          setServices(active.length > 0 ? active : DEFAULT_SERVICES);
        }, err => handleFirestoreError(err, 'تحميل قائمة الخدمات'));

        return () => unsubServices();
      }, []);

      useEffect(() => {
        if (!customerId || !db) {
          setMyJobs([]);
          return;
        }
        const q = query(collection(db, 'jobs'), where('customerId', '==', customerId), limit(50));
        const unsubJobs = onSnapshot(q, (snapshot) => {
          const data = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
          setMyJobs(data.sort((a, b) => b.createdAt - a.createdAt));
        }, err => handleFirestoreError(err, 'تحميل طلبات العميل'));

        return () => unsubJobs();
      }, [customerId]);

      const handleCustomerLogin = (e) => {
        e.preventDefault();
        const cleanName = loginName.trim();
        const cleanPhone = loginPhone.replace(/\s+/g, '').trim();
        if (!cleanName || !cleanPhone) return;

        const session = { name: cleanName, phone: cleanPhone, customerId: `cust_${cleanPhone}` };
        localStorage.setItem(CUSTOMER_STORAGE_KEY, JSON.stringify(session));
        setCustomerSession(session);
        setCurrentScreen('home');
      };

      const handleCustomerLogout = () => {
        localStorage.removeItem(CUSTOMER_STORAGE_KEY);
        setCustomerSession(null);
        setLoginName('');
        setLoginPhone('');
        setCurrentScreen('home');
      };

      const handleUpdateCustomerSession = (newName, newPhone) => {
        const cleanName = newName.trim();
        const cleanPhone = newPhone.replace(/\s+/g, '').trim();
        if (!cleanName || !cleanPhone) return;
        const updated = { name: cleanName, phone: cleanPhone, customerId: `cust_${cleanPhone}` };
        localStorage.setItem(CUSTOMER_STORAGE_KEY, JSON.stringify(updated));
        setCustomerSession(updated);
      };

      const activeJob = myJobs.find(j => ['pending', 'assigned', 'in_route', 'in_progress'].includes(j.status));

      const startBooking = (serviceId, isDirect) => {
        setSelectedServiceId(serviceId);
        setIsDirectBooking(isDirect);
        setBookingStep(1);
        setCurrentScreen('booking');
      };

      return (
        <div className="flex flex-col h-screen w-full bg-slate-50 overflow-hidden relative" dir="rtl">
          {!customerSession ? (
            <div className="flex-1 overflow-y-auto flex flex-col items-center justify-center p-6 bg-slate-50">
              <div className="w-full max-w-md bg-white rounded-3xl p-6 shadow-md border border-slate-200/80 space-y-6">
                <div className="text-center space-y-2">
                  <div className="w-16 h-16 bg-blue-600 text-white rounded-2xl flex items-center justify-center mx-auto shadow-lg shadow-blue-600/20 mb-3">
                    <i data-lucide="user" className="w-8 h-8"></i>
                  </div>
                  <h1 className="text-xl font-bold text-slate-900">مرحباً بك في خدمات الصيانة</h1>
                  <p className="text-xs text-slate-500 leading-relaxed">
                    يرجى إدخال الاسم الكامل ورقم الهاتف للدخول وطلب خدمات الصيانة الميدانية ومتابعة حجوزاتك.
                  </p>
                </div>

                <form onSubmit={handleCustomerLogin} className="space-y-4">
                  <div>
                    <label className="block text-xs font-bold text-slate-700 mb-1.5">الاسم الكامل للزبون</label>
                    <div className="relative">
                      <i data-lucide="user" className="w-4 h-4 text-slate-400 absolute right-3.5 top-1/2 -translate-y-1/2"></i>
                      <input
                        type="text"
                        required
                        value={loginName}
                        onChange={(e) => setLoginName(e.target.value)}
                        placeholder="مثال: محمد بن عبد الله"
                        className="w-full pl-4 pr-10 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:bg-white focus:ring-2 focus:ring-blue-600 outline-none transition-all"
                      />
                    </div>
                  </div>

                  <div>
                    <label className="block text-xs font-bold text-slate-700 mb-1.5">رقم الهاتف (معرف الحساب)</label>
                    <div className="relative">
                      <i data-lucide="phone" className="w-4 h-4 text-slate-400 absolute right-3.5 top-1/2 -translate-y-1/2"></i>
                      <input
                        type="tel"
                        required
                        dir="ltr"
                        value={loginPhone}
                        onChange={(e) => setLoginPhone(e.target.value)}
                        placeholder="0550123456"
                        className="w-full pl-4 pr-10 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm text-right font-mono focus:bg-white focus:ring-2 focus:ring-blue-600 outline-none transition-all"
                      />
                    </div>
                  </div>

                  <button
                    type="submit"
                    className="w-full bg-blue-600 hover:bg-blue-700 active:scale-[0.99] text-white py-3.5 rounded-xl font-bold text-sm shadow-md transition-all cursor-pointer"
                  >
                    دخول ومتابعة للخدمات
                  </button>
                </form>
              </div>
            </div>
          ) : (
            <>
              <div className="flex-1 overflow-hidden flex flex-col relative bg-slate-50">
                {currentScreen === 'home' && (
                  <CustomerHome 
                    customer={customerSession}
                    services={services}
                    activeJob={activeJob}
                    onBook={startBooking} 
                    onTrack={() => setCurrentScreen('tracking')}
                    onInvoice={() => setCurrentScreen('invoice')}
                    onLogout={handleCustomerLogout}
                  />
                )}
                {currentScreen === 'booking' && (
                  <BookingFlow 
                    step={bookingStep} 
                    setStep={setBookingStep}
                    serviceId={selectedServiceId}
                    isDirect={isDirectBooking}
                    services={services}
                    customerId={customerSession.customerId}
                    customerName={customerSession.name}
                    customerPhone={customerSession.phone}
                    onFinish={() => setCurrentScreen('home')}
                    onCancel={() => setCurrentScreen('home')}
                  />
                )}
                {currentScreen === 'tracking' && activeJob && (
                  <TrackingScreen job={activeJob} onBack={() => setCurrentScreen('home')} />
                )}
                {currentScreen === 'invoice' && (
                  <InvoiceScreen job={myJobs.find(j => j.status === 'completed')} onBack={() => setCurrentScreen('home')} />
                )}
                {currentScreen === 'assets' && (
                  <AssetsScreen onBack={() => setCurrentScreen('home')} />
                )}
                {currentScreen === 'profile' && (
                  <CustomerProfileScreen
                    customer={customerSession}
                    onSave={handleUpdateCustomerSession}
                    onLogout={handleCustomerLogout}
                    onBack={() => setCurrentScreen('home')}
                  />
                )}
                {currentScreen === 'bookings' && (
                  <CustomerBookingsScreen jobs={myJobs} onBack={() => setCurrentScreen('home')} />
                )}
              </div>

              {['home', 'assets', 'profile', 'bookings'].includes(currentScreen) && (
                <div className="bg-white border-t border-slate-200 flex items-center justify-around p-3 pb-6 shrink-0 z-40">
                  <button onClick={() => setCurrentScreen('home')} className={`flex flex-col items-center transition-colors ${currentScreen === 'home' ? 'text-blue-600' : 'text-slate-400 hover:text-slate-600'}`}>
                     <i data-lucide="home" className="w-6 h-6"></i>
                     <span className="text-[10px] mt-1 font-bold">الرئيسية</span>
                  </button>
                  <button onClick={() => setCurrentScreen('bookings')} className={`flex flex-col items-center transition-colors ${currentScreen === 'bookings' ? 'text-blue-600' : 'text-slate-400 hover:text-slate-600'}`}>
                     <i data-lucide="file-clock" className="w-6 h-6"></i>
                     <span className="text-[10px] mt-1 font-bold">حجوزاتي</span>
                  </button>
                  <button onClick={() => setCurrentScreen('assets')} className={`flex flex-col items-center transition-colors ${currentScreen === 'assets' ? 'text-blue-600' : 'text-slate-400 hover:text-slate-600'}`}>
                     <i data-lucide="box" className="w-6 h-6"></i>
                     <span className="text-[10px] mt-1 font-bold">أجهزتي</span>
                  </button>
                  <button onClick={() => setCurrentScreen('profile')} className={`flex flex-col items-center transition-colors ${currentScreen === 'profile' ? 'text-blue-600' : 'text-slate-400 hover:text-slate-600'}`}>
                     <i data-lucide="user" className="w-6 h-6"></i>
                     <span className="text-[10px] mt-1 font-bold">حسابي</span>
                  </button>
                </div>
              )}
            </>
          )}
        </div>
      );
    }

    function CustomerHome({ customer, services, activeJob, onBook, onTrack, onLogout }) {
      useEffect(() => { lucide.createIcons(); }, []);
      return (
        <div className="flex-1 flex flex-col overflow-y-auto">
          <div className="bg-blue-600 px-6 pt-6 pb-12 rounded-b-3xl shadow-sm text-white shrink-0 flex items-start justify-between">
            <div>
              <h1 className="text-xl font-bold mb-1">مرحباً، {customer?.name}</h1>
              <p className="text-blue-100 text-xs font-mono" dir="ltr">{customer?.phone}</p>
            </div>
            <button
              type="button"
              onClick={onLogout}
              title="تسجيل الخروج / تغيير الحساب"
              className="bg-white/15 hover:bg-white/25 text-white px-3 py-1.5 rounded-xl text-xs font-bold flex items-center gap-1.5 transition-colors cursor-pointer"
            >
              <i data-lucide="log-out" className="w-3.5 h-3.5"></i>
              <span>خروج</span>
            </button>
          </div>

          <div className="px-6 -mt-8 relative z-10 space-y-6">
            {activeJob && (
              <div onClick={onTrack} className="bg-white rounded-2xl p-4 shadow-md border border-slate-100 flex items-center justify-between cursor-pointer active:scale-95 transition-transform">
                <div className="flex items-center gap-4">
                  <div className="w-12 h-12 bg-blue-50 text-blue-600 rounded-full flex items-center justify-center shrink-0">
                    <i data-lucide="navigation" className="w-6 h-6"></i>
                  </div>
                  <div>
                    <p className="font-bold text-slate-800 text-sm">
                      {activeJob.status === 'pending' ? 'جاري البحث عن فني...' : 
                       activeJob.status === 'assigned' ? 'تم تعيين فني لطلبك' :
                       activeJob.status === 'in_route' ? 'الفني في الطريق إليك' : 'الفني يعمل الآن'}
                    </p>
                    <p className="text-xs text-blue-600 font-medium mt-1">اضغط للتتبع المباشر</p>
                  </div>
                </div>
                <i data-lucide="chevron-right" className="w-5 h-5 text-slate-400"></i>
              </div>
            )}

            <div>
              <h2 className="font-bold text-slate-800 text-sm mb-3">دليل الخدمات (حجز مباشر)</h2>
              <div className="grid grid-cols-2 gap-3">
                {services.map((s) => (
                  <div 
                    key={s.id} 
                    onClick={() => onBook(s.id, true)} 
                    className="bg-white rounded-xl p-4 shadow-sm border border-slate-100 flex flex-col items-center justify-center gap-2 cursor-pointer active:scale-95 transition-transform text-center aspect-square hover:border-blue-300"
                  >
                    <div className="w-10 h-10 rounded-full flex items-center justify-center bg-blue-50 text-blue-600">
                      <i data-lucide="wrench" className="w-5 h-5"></i>
                    </div>
                    <span className="text-xs font-bold text-slate-700 leading-tight">{s.name}</span>
                    <span className="text-[10px] font-bold text-blue-600">{s.basePrice} دج</span>
                  </div>
                ))}
              </div>
            </div>

            <button 
              onClick={() => onBook(null, false)} 
              className="w-full bg-slate-900 text-white py-4 rounded-xl font-bold shadow-md hover:bg-slate-800 transition-colors flex items-center justify-center gap-2"
            >
              <i data-lucide="wrench" className="w-5 h-5"></i>
              <span>طلب خدمة</span>
            </button>
          </div>
        </div>
      );
    }

    function BookingFlow({ step, setStep, serviceId, isDirect, services, customerId, customerName, customerPhone, onFinish, onCancel }) {
      const selectedService = services.find(s => s.id === serviceId);
      const [desc, setDesc] = useState('');
      const [categoryId, setCategoryId] = useState(selectedService?.category || 'تكييف وتبريد');
      const [date, setDate] = useState('');
      const [time, setTime] = useState('');
      const [location, setLocation] = useState(myLocation);
      const [address, setAddress] = useState('الجلفة، حي البساتين');
      const [isSearchingMap, setIsSearchingMap] = useState(false);
      const [isLocatingGps, setIsLocatingGps] = useState(false);
      const [gpsFeedback, setGpsFeedback] = useState(null);
      const mapRef = useRef(null);
      const markerRef = useRef(null);

      useEffect(() => {
        lucide.createIcons();
      }, [step]);

      useEffect(() => {
        if (step === (isDirect ? 2 : 4)) {
          setTimeout(() => {
            if (!mapRef.current) {
              const mapEl = document.getElementById('leaflet-map-container');
              if (mapEl && !mapEl._leaflet_id) {
                const map = L.map(mapEl).setView(location, 14);
                L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                  attribution: '&copy; OpenStreetMap'
                }).addTo(map);

                const marker = L.marker(location, { draggable: true }).addTo(map);
                markerRef.current = marker;

                marker.on('dragend', (e) => {
                  const pos = marker.getLatLng();
                  reverseGeocode(pos.lat, pos.lng);
                });

                map.on('click', (e) => {
                  marker.setLatLng(e.latlng);
                  reverseGeocode(e.latlng.lat, e.latlng.lng);
                });

                mapRef.current = map;
              }
            } else {
              mapRef.current.invalidateSize();
            }
          }, 200);
        }
      }, [step]);

      const reverseGeocode = async (lat, lng) => {
        setLocation([lat, lng]);
        setAddress('جاري جلب العنوان...');
        if (markerRef.current) markerRef.current.setLatLng([lat, lng]);
        if (mapRef.current) mapRef.current.setView([lat, lng], 15);

        try {
          const res = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lng}&accept-language=ar`);
          const data = await res.json();
          if (data?.display_name) {
            const shortName = data.display_name.split(',').slice(0, 3).join('، ');
            setAddress(shortName || `${lat.toFixed(5)}, ${lng.toFixed(5)}`);
          } else {
            setAddress(`${lat.toFixed(5)}, ${lng.toFixed(5)}`);
          }
        } catch {
          setAddress(`${lat.toFixed(5)}, ${lng.toFixed(5)}`);
        }
      };

      const forwardGeocode = async (queryText) => {
        const q = (queryText || address).trim();
        if (!q || q.length < 2) return;
        setIsSearchingMap(true);
        try {
          const res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(q + ' الجزائر')}&accept-language=ar`);
          const data = await res.json();
          if (data && data.length > 0) {
            const lat = parseFloat(data[0].lat);
            const lon = parseFloat(data[0].lon);
            setLocation([lat, lon]);
            if (markerRef.current) markerRef.current.setLatLng([lat, lon]);
            if (mapRef.current) mapRef.current.setView([lat, lon], 15);
            setAddress(data[0].display_name.split(',').slice(0, 3).join('، '));
          }
        } catch {} finally {
          setIsSearchingMap(false);
        }
      };

      const handleLocateMe = () => {
        if (!navigator.geolocation) {
          setGpsFeedback('المتصفح لا يدعم تحديد الموقع');
          return;
        }
        setIsLocatingGps(true);
        navigator.geolocation.getCurrentPosition(
          pos => {
            setIsLocatingGps(false);
            reverseGeocode(pos.coords.latitude, pos.coords.longitude);
          },
          () => {
            setIsLocatingGps(false);
            setGpsFeedback('تعذر جلب موقع GPS تلقائياً');
          },
          { enableHighAccuracy: true, timeout: 10000 }
        );
      };

      const submitBooking = async () => {
        try {
          const cleanAddr = address.trim();
          const finalAddress = (cleanAddr && cleanAddr !== 'جاري جلب العنوان...') ? cleanAddr : `${location[0].toFixed(5)}, ${location[1].toFixed(5)}`;
          const orderDesc = desc ? `${desc} | العنوان: ${finalAddress}` : (selectedService?.name ? `${selectedService.name} - ${finalAddress}` : `طلب صيانة - ${finalAddress}`);

          await addDoc(collection(db, 'jobs'), {
            customerId,
            customerName: customerName || '',
            customerPhone: customerPhone || '',
            technicianId: null,
            status: 'pending',
            type: categoryId,
            title: selectedService?.name || 'طلب صيانة جديد',
            description: orderDesc,
            location: { latitude: location[0], longitude: location[1] },
            address: finalAddress,
            customerLocation: { latitude: location[0], longitude: location[1], address: finalAddress },
            serviceId: serviceId || 'custom',
            pricing: { basePrice: selectedService?.basePrice || 50, addOnTotal: 0, finalTotal: selectedService?.basePrice || 50 },
            addons: [],
            createdAt: Date.now()
          });
          setStep(isDirect ? 4 : 6);
        } catch (e) {
          handleFirestoreError(e, 'إنشاء وحفظ الطلب');
        }
      };

      const getHeaderTitle = () => {
        if (isDirect) {
          if (step === 1) return 'اختر الموعد (حجز مباشر)';
          if (step === 2) return 'موقع الخدمة';
          if (step === 3) return 'الكشف التقديري';
          return 'تم الحجز';
        } else {
          if (step === 1) return 'اختيار الفئة';
          if (step === 2) return 'تفاصيل المشكلة';
          if (step === 3) return 'الموعد المناسب';
          if (step === 4) return 'موقع الخدمة';
          if (step === 5) return 'الكشف التقديري';
          return 'تم الحجز';
        }
      };

      return (
        <div className="flex-1 flex flex-col bg-slate-50 h-full overflow-hidden" dir="rtl">
          <div className="bg-white px-4 py-4 border-b border-slate-200 flex items-center shrink-0">
            <button onClick={() => { if (step > 1) setStep(step - 1); else onCancel(); }} className="p-2 hover:bg-slate-100 rounded-full transition-colors">
              <i data-lucide="chevron-right" className="w-6 h-6 text-slate-700"></i>
            </button>
            <h2 className="flex-1 text-center font-bold text-slate-800 text-base ml-10">{getHeaderTitle()}</h2>
          </div>

          <div className="flex-1 overflow-y-auto p-6 flex flex-col">
            {isDirect ? (
              <>
                {step === 1 && (
                  <div className="space-y-6 flex-1">
                    {selectedService && (
                      <div className="bg-blue-50 border border-blue-100 p-4 rounded-2xl flex items-center justify-between">
                        <div>
                          <p className="text-xs text-blue-600 font-bold uppercase">{selectedService.category}</p>
                          <h3 className="font-bold text-slate-900 text-base">{selectedService.name}</h3>
                        </div>
                        <span className="font-bold text-blue-700 text-lg">{selectedService.basePrice} دج</span>
                      </div>
                    )}
                    <div>
                      <label className="block text-sm font-bold text-slate-700 mb-2">التاريخ</label>
                      <input type="date" value={date} onChange={e => setDate(e.target.value)} className="w-full bg-white border border-slate-200 rounded-xl p-3 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 font-medium" />
                    </div>
                    <div>
                      <label className="block text-sm font-bold text-slate-700 mb-2">الوقت المناسب</label>
                      <div className="grid grid-cols-2 gap-3">
                        {['08:00 ص', '10:00 ص', '02:00 م', '04:00 م'].map(t => (
                          <button key={t} onClick={() => setTime(t)} className={`p-3 rounded-xl border-2 text-sm font-bold ${time === t ? 'border-blue-600 bg-blue-50 text-blue-600' : 'border-slate-200 text-slate-600'}`}>
                            {t}
                          </button>
                        ))}
                      </div>
                    </div>
                    <button disabled={!date || !time} onClick={() => setStep(2)} className="w-full bg-blue-600 text-white py-4 rounded-xl font-bold text-sm shadow-md mt-auto disabled:opacity-50">التالي: تحديد الموقع</button>
                  </div>
                )}

                {step === 2 && (
                  <div className="flex-1 flex flex-col space-y-3">
                    <div className="flex justify-between items-center">
                      <label className="text-sm font-bold text-slate-800">العنوان التفصيلي / الشارع</label>
                      <button onClick={handleLocateMe} className="bg-emerald-50 text-emerald-700 border border-emerald-200 px-2.5 py-1.5 rounded-lg text-[11px] font-bold flex items-center gap-1">
                        <i data-lucide="crosshair" className="w-3.5 h-3.5"></i> موقعي (GPS)
                      </button>
                    </div>
                    <div className="flex gap-2">
                      <input type="text" value={address} onChange={e => setAddress(e.target.value)} className="w-full bg-white border-2 border-slate-200 rounded-xl p-3 text-sm font-bold text-slate-800" />
                      <button onClick={() => forwardGeocode(address)} className="bg-blue-600 text-white px-3.5 rounded-xl font-bold text-xs">بحث</button>
                    </div>
                    <div id="leaflet-map-container" className="flex-1 min-h-[210px] rounded-xl border-2 border-slate-200"></div>
                    <button disabled={!address.trim()} onClick={() => setStep(3)} className="w-full bg-blue-600 text-white py-4 rounded-xl font-bold text-sm shadow-md">التالي: الكشف التقديري</button>
                  </div>
                )}

                {step === 3 && (
                  <div className="flex-1 flex flex-col">
                    <div className="bg-white rounded-xl shadow-sm border border-slate-200 p-5 mb-4 space-y-4">
                      <h3 className="font-bold text-lg">{selectedService?.name || 'خدمة صيانة'}</h3>
                      <div className="p-3 bg-slate-50 rounded-lg text-sm space-y-2">
                        <div className="flex justify-between"><span>الموعد:</span><span className="font-bold">{date} - {time}</span></div>
                        <div className="flex justify-between"><span>العنوان:</span><span className="font-bold truncate max-w-[200px]">{address}</span></div>
                      </div>
                      <div className="border-t pt-3 flex justify-between items-center">
                        <span className="font-bold text-slate-700">التكلفة الأساسية</span>
                        <span className="font-bold text-blue-600 text-xl">{selectedService?.basePrice || 50} دج</span>
                      </div>
                    </div>
                    <button onClick={submitBooking} className="w-full bg-blue-600 text-white py-4 rounded-xl font-bold text-sm shadow-md mt-auto">تأكيد وإرسال الطلب</button>
                  </div>
                )}

                {step === 4 && (
                  <div className="flex-1 flex flex-col items-center justify-center text-center space-y-6">
                    <div className="w-20 h-20 bg-green-100 text-green-500 rounded-full flex items-center justify-center mb-4">
                      <i data-lucide="check-circle" className="w-10 h-10"></i>
                    </div>
                    <h2 className="text-xl font-bold text-slate-900">تم حجز الخدمة بنجاح!</h2>
                    <button onClick={onFinish} className="w-full bg-slate-900 text-white py-4 rounded-xl font-bold text-sm">العودة للرئيسية</button>
                  </div>
                )}
              </>
            ) : (
              <>
                {step === 1 && (
                  <div className="space-y-4 flex-1">
                    <h3 className="font-bold text-lg mb-4 text-slate-800">1. اختر فئة الخدمة</h3>
                    {['ترصيص وسباكة', 'تكييف وتبريد', 'تدفئة مركزية'].map(cat => (
                      <div key={cat} onClick={() => { setCategoryId(cat); setStep(2); }} className="bg-white p-5 rounded-2xl border-2 border-slate-200 cursor-pointer flex items-center gap-4 hover:border-blue-300">
                        <div className="w-12 h-12 bg-blue-100 text-blue-600 rounded-full flex items-center justify-center"><i data-lucide="wrench" className="w-6 h-6"></i></div>
                        <div><h3 className="font-bold text-slate-900">{cat}</h3><p className="text-xs text-slate-500">طلب خدمة شامل مع الكشف</p></div>
                      </div>
                    ))}
                  </div>
                )}
                {step === 2 && (
                  <div className="space-y-6 flex-1">
                    <label className="block text-sm font-bold text-slate-700 mb-2">2. وصف المشكلة</label>
                    <textarea value={desc} onChange={e => setDesc(e.target.value)} className="w-full bg-white border border-slate-200 rounded-xl p-3 text-sm h-32" placeholder="صف المشكلة..."></textarea>
                    <button disabled={!desc} onClick={() => setStep(3)} className="w-full bg-blue-600 text-white py-4 rounded-xl font-bold text-sm mt-auto">متابعة للموعد</button>
                  </div>
                )}
                {step === 3 && (
                  <div className="space-y-6 flex-1">
                    <label className="block text-sm font-bold text-slate-700 mb-2">3. الموعد المناسب</label>
                    <input type="date" value={date} onChange={e => setDate(e.target.value)} className="w-full bg-white border border-slate-200 rounded-xl p-3 text-sm" />
                    <div className="grid grid-cols-2 gap-3">
                      {['08:00 ص', '10:00 ص', '02:00 م', '04:00 م'].map(t => (
                        <button key={t} onClick={() => setTime(t)} className={`p-3 rounded-xl border-2 text-sm font-bold ${time === t ? 'border-blue-600 bg-blue-50 text-blue-600' : 'border-slate-200'}`}>{t}</button>
                      ))}
                    </div>
                    <button disabled={!date || !time} onClick={() => setStep(4)} className="w-full bg-blue-600 text-white py-4 rounded-xl font-bold text-sm mt-auto">متابعة لموقع الخدمة</button>
                  </div>
                )}
                {step === 4 && (
                  <div className="flex-1 flex flex-col space-y-3">
                    <div className="flex justify-between items-center">
                      <label className="text-sm font-bold text-slate-800">العنوان التفصيلي / الشارع</label>
                      <button onClick={handleLocateMe} className="bg-emerald-50 text-emerald-700 border px-2.5 py-1.5 rounded-lg text-[11px] font-bold">موقعي (GPS)</button>
                    </div>
                    <input type="text" value={address} onChange={e => setAddress(e.target.value)} className="w-full bg-white border-2 border-slate-200 rounded-xl p-3 text-sm font-bold" />
                    <div id="leaflet-map-container" className="flex-1 min-h-[210px] rounded-xl border-2 border-slate-200"></div>
                    <button onClick={() => setStep(5)} className="w-full bg-blue-600 text-white py-4 rounded-xl font-bold text-sm">التالي: الكشف التقديري</button>
                  </div>
                )}
                {step === 5 && (
                  <div className="flex-1 flex flex-col">
                    <div className="bg-white rounded-xl border p-5 mb-4 space-y-4">
                      <h3 className="font-bold text-lg">الكشف التقديري</h3>
                      <p className="text-sm text-slate-500">{categoryId}</p>
                      <div className="flex justify-between border-t pt-3 font-bold"><span>رسوم الزيارة</span><span className="text-blue-600 text-xl">50.00 دج</span></div>
                    </div>
                    <button onClick={submitBooking} className="w-full bg-blue-600 text-white py-4 rounded-xl font-bold text-sm mt-auto">تأكيد وإرسال الطلب</button>
                  </div>
                )}
                {step === 6 && (
                  <div className="flex-1 flex flex-col items-center justify-center text-center space-y-6">
                    <div className="w-20 h-20 bg-green-100 text-green-500 rounded-full flex items-center justify-center"><i data-lucide="check-circle" className="w-10 h-10"></i></div>
                    <h2 className="text-xl font-bold text-slate-900">تم إرسال طلبك بنجاح!</h2>
                    <button onClick={onFinish} className="w-full bg-slate-900 text-white py-4 rounded-xl font-bold text-sm">العودة للرئيسية</button>
                  </div>
                )}
              </>
            )}
          </div>
        </div>
      );
    }

    function TrackingScreen({ job, onBack }) {
      useEffect(() => {
        lucide.createIcons();
        const mapEl = document.getElementById('tracking-map');
        if (mapEl && !mapEl._leaflet_id) {
          const lat = job?.location?.latitude || myLocation[0];
          const lon = job?.location?.longitude || myLocation[1];
          const map = L.map(mapEl).setView([lat, lon], 14);
          L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
          L.marker([lat, lon]).addTo(map).bindPopup(job?.address || 'موقعك');
        }
      }, []);

      return (
        <div className="flex-1 flex flex-col bg-slate-50 relative">
          <div className="absolute top-4 right-4 z-[1000]">
            <button onClick={onBack} className="w-10 h-10 bg-white/90 rounded-full flex items-center justify-center shadow-md">
              <i data-lucide="chevron-right" className="w-6 h-6 text-slate-700"></i>
            </button>
          </div>
          <div id="tracking-map" className="flex-1 relative bg-slate-200"></div>
          <div className="bg-white rounded-t-3xl shadow-lg p-6 relative z-20">
            <h3 className="font-bold text-slate-900 text-lg">جاري تتبع الطلب</h3>
            <p className="text-xs text-slate-500 mt-1">{job.title} - {job.address}</p>
          </div>
        </div>
      );
    }

    function InvoiceScreen({ job, onBack }) {
      useEffect(() => { lucide.createIcons(); }, []);
      if (!job) return <div className="p-6 text-center text-slate-500 font-bold" onClick={onBack}>لا توجد فواتير سابقة</div>;

      return (
        <div className="flex-1 flex flex-col bg-slate-50 overflow-hidden" dir="rtl">
          <div className="bg-white px-4 py-4 border-b flex items-center shrink-0">
            <button onClick={onBack} className="p-2 hover:bg-slate-100 rounded-full"><i data-lucide="chevron-right" className="w-6 h-6 text-slate-700"></i></button>
            <h2 className="flex-1 text-center font-bold text-slate-800 text-base ml-10">الفاتورة والضمان</h2>
          </div>
          <div className="flex-1 overflow-y-auto p-6 space-y-6">
            <div className="bg-white rounded-2xl shadow-sm border p-6">
              <div className="flex justify-between items-center mb-6 border-b pb-4">
                <div><p className="text-[10px] text-slate-400">رقم الفاتورة</p><p className="font-bold text-slate-900">#{job.id?.slice(-6)}</p></div>
                <span className="bg-emerald-50 text-emerald-700 border text-xs font-bold px-3 py-1 rounded-full">مدفوع</span>
              </div>
              <div className="space-y-3 mb-6">
                <div className="flex justify-between text-sm"><span className="text-slate-600">الخدمة</span><span className="font-bold">{job.title}</span></div>
                <div className="flex justify-between text-sm"><span className="text-slate-600">الإجمالي النهائي</span><span className="font-bold text-blue-600 text-xl">{(job.pricing?.finalTotal || 0).toFixed(2)} دج</span></div>
              </div>
            </div>
          </div>
        </div>
      );
    }

    function AssetsScreen({ onBack }) {
      useEffect(() => { lucide.createIcons(); }, []);
      const assets = [
        { id: 'ast_1', name: 'مكيف هواء سبليت 18000 وحدة', category: 'تكييف وتبريد', installDate: '2026-03-01', warrantyExpiry: '2026-09-01', status: 'ساري', certificateNo: 'WAR-2026-8841' },
        { id: 'ast_2', name: 'سخان المياه المركزي (غلاية)', category: 'تدفئة مركزية', installDate: '2026-01-15', warrantyExpiry: '2026-07-15', status: 'ساري', certificateNo: 'WAR-2026-3392' }
      ];
      return (
        <div className="flex-1 flex flex-col bg-slate-50 h-full overflow-hidden">
          <div className="bg-white px-4 py-4 border-b flex items-center shrink-0">
            <button onClick={onBack} className="p-2 hover:bg-slate-100 rounded-full"><i data-lucide="chevron-right" className="w-6 h-6 text-slate-700"></i></button>
            <h2 className="flex-1 text-center font-bold text-slate-800 text-base ml-10">أجهزتي وضماناتي الرقمية</h2>
          </div>
          <div className="flex-1 overflow-y-auto p-4 space-y-4">
            {assets.map(asset => (
              <div key={asset.id} className="bg-white p-4 rounded-2xl shadow-sm border space-y-2">
                <div className="flex justify-between"><span className="text-xs font-bold text-emerald-700 bg-emerald-50 px-2 py-0.5 rounded">✓ ساري</span><span className="text-xs font-mono">{asset.certificateNo}</span></div>
                <h4 className="font-bold text-slate-900 text-sm">{asset.name}</h4>
                <p className="text-xs text-slate-500">{asset.category}</p>
              </div>
            ))}
          </div>
        </div>
      );
    }

    function CustomerProfileScreen({ customer, onSave, onLogout, onBack }) {
      const [name, setName] = useState(customer?.name || '');
      const [phone, setPhone] = useState(customer?.phone || '');
      useEffect(() => { lucide.createIcons(); }, []);
      return (
        <div className="flex-1 flex flex-col bg-slate-50 h-full">
          <div className="bg-white px-4 py-4 border-b flex items-center shrink-0">
            <button onClick={onBack} className="p-2"><i data-lucide="chevron-right" className="w-6 h-6"></i></button>
            <h2 className="flex-1 text-center font-bold text-base ml-10">حسابي الشخصي</h2>
          </div>
          <div className="p-6 space-y-4">
            <div><label className="block text-sm font-bold mb-1">الاسم الكامل</label><input value={name} onChange={e => setName(e.target.value)} className="w-full px-4 py-2.5 bg-white border rounded-xl" /></div>
            <div><label className="block text-sm font-bold mb-1">رقم الهاتف</label><input dir="ltr" value={phone} onChange={e => setPhone(e.target.value)} className="w-full px-4 py-2.5 bg-white border rounded-xl text-right font-mono" /></div>
            <button onClick={() => { onSave(name, phone); onBack(); }} className="w-full bg-blue-600 text-white py-3.5 rounded-xl font-bold">حفظ التغييرات</button>
            <button onClick={onLogout} className="w-full bg-red-50 text-red-600 border py-3 rounded-xl font-bold flex items-center justify-center gap-2"><i data-lucide="log-out" className="w-4 h-4"></i> تسجيل الخروج</button>
          </div>
        </div>
      );
    }

    function CustomerBookingsScreen({ jobs, onBack }) {
      const [reviewJob, setReviewJob] = useState(null);
      useEffect(() => { lucide.createIcons(); }, [reviewJob]);
      return (
        <div className="flex-1 flex flex-col bg-slate-50 h-full">
          <div className="bg-white px-4 py-4 border-b flex items-center shrink-0">
            <button onClick={onBack} className="p-2"><i data-lucide="chevron-right" className="w-6 h-6"></i></button>
            <h2 className="flex-1 text-center font-bold text-base ml-10">حجوزاتي وتقييم الخدمات</h2>
          </div>
          <div className="flex-1 overflow-y-auto p-4 space-y-4">
            {jobs.length === 0 && <p className="text-center text-slate-500 text-sm mt-4">لا توجد طلبات</p>}
            {jobs.map(job => (
              <div key={job.id} className="bg-white p-4 rounded-xl shadow-sm border space-y-2">
                <div className="flex justify-between items-start">
                  <span className="px-2 py-0.5 text-[10px] font-bold rounded bg-slate-100 text-slate-600">{job.status}</span>
                  <span className="text-xs text-slate-400">{new Date(job.createdAt).toLocaleDateString()}</span>
                </div>
                <h3 className="font-bold text-slate-800 text-sm">{job.title}</h3>
                <p className="text-xs text-slate-500">{job.description}</p>
                <div className="flex justify-between items-center pt-2 border-t">
                  <span className="font-bold text-blue-600 text-sm">{(job.pricing?.finalTotal || job.pricing?.basePrice || 0).toFixed(2)} دج</span>
                  {job.status === 'completed' && (
                    <button onClick={() => setReviewJob(job)} className="px-3 py-1.5 bg-blue-600 text-white rounded-lg text-xs font-bold flex items-center gap-1">
                      <i data-lucide="star" className="w-3.5 h-3.5"></i> قيم الخدمة
                    </button>
                  )}
                </div>
              </div>
            ))}
          </div>

          {reviewJob && (
            <div className="fixed inset-0 z-50 bg-slate-900/60 flex items-center justify-center p-4">
              <div className="bg-white rounded-2xl p-6 w-full max-w-md space-y-4">
                <h3 className="font-bold text-lg">تقييم الخدمة</h3>
                <p className="text-xs text-slate-500">كيف كانت تجربتك؟</p>
                <div className="flex justify-center gap-2">
                  {[1,2,3,4,5].map(s => (
                    <button key={s} onClick={async () => {
                      if (reviewJob.id) {
                        await updateDoc(doc(db, 'jobs', reviewJob.id), { rating: s });
                      }
                      setReviewJob(null);
                    }} className="p-2 text-amber-400 hover:scale-110 transition-transform">
                      <i data-lucide="star" className="w-8 h-8 fill-amber-400"></i>
                    </button>
                  ))}
                </div>
                <button onClick={() => setReviewJob(null)} className="w-full bg-slate-200 py-2.5 rounded-xl font-bold">إغلاق</button>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
